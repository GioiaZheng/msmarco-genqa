# Config-driven end-to-end pipeline plan.
#
# This file is intentionally command-oriented: each stage names the exact
# script/arguments to run. `scripts/run_pipeline.py --dry-run` prints the plan
# without touching data or models; omit `--dry-run` to execute stages in order.

tracking:
  backend: jsonl
  output_dir: outputs/pipeline_tracking

stages:
  - name: query_transformation
    description: Deterministic query normalization or expansion audit before retrieval.
    command:
      - mgq-transform-queries
      - --config
      - configs/baseline.yaml
      - --output-dir
      - outputs/query_transform/none

  - name: bm25_retrieval
    description: Full-corpus BM25 baseline on dev/small.
    command:
      - mgq-retrieve
      - --config
      - configs/baseline.yaml

  - name: dense_retrieval
    description: Sentence-BERT + FAISS dense retrieval, with BM25-on-sample comparison.
    command:
      - mgq-dense
      - --config
      - configs/baseline.yaml

  - name: hybrid_rrf_fusion
    description: Weighted RRF fusion over BM25-on-sample and dense first-stage runs.
    command:
      - python
      - experiments/run_hybrid_fusion.py
      - --input-run
      - bm25_sample=outputs/W4_dense/run_bm25_sample.tsv
      - --input-run
      - dense=outputs/W4_dense/run.tsv
      - --output-dir
      - outputs/W4_hybrid_rrf
      - --top-k
      - "1000"

  - name: cross_encoder_rerank
    description: Cross-encoder reranking over dense top-100; quantifies rerank lift.
    command:
      - mgq-rerank
      - --config
      - configs/baseline.yaml

  - name: hybrid_rrf_rerank
    description: Cross-encoder reranking over the fused RRF candidate run.
    command:
      - python
      - experiments/run_reranker.py
      - --input-run
      - outputs/W4_hybrid_rrf/run.tsv
      - --output-dir
      - outputs/W5_hybrid_rrf_reranker
      - --resume

  - name: retrieval_quality_report
    description: Matched-qid retrieval metrics and movement diagnostics for dense vs reranked runs.
    command:
      - mgq-retrieval-report
      - compare
      - --baseline-run
      - outputs/W4_dense/run.tsv
      - --candidate-run
      - outputs/W5_reranker_full/run.tsv
      - --baseline-name
      - dense
      - --candidate-name
      - reranked
      - --output-dir
      - outputs/retrieval_reports/dense_vs_reranked

  - name: hybrid_matrix_report
    description: Same-qid BM25, dense, RRF, and RRF-plus-rerank retrieval matrix.
    command:
      - mgq-retrieval-report
      - matrix
      - --run
      - bm25_sample=outputs/W4_dense/run_bm25_sample.tsv
      - --run
      - dense=outputs/W4_dense/run.tsv
      - --run
      - rrf=outputs/W4_hybrid_rrf/run.tsv
      - --run
      - rrf_reranked=outputs/W5_hybrid_rrf_reranker/run.tsv
      - --baseline-name
      - bm25_sample
      - --output-dir
      - outputs/retrieval_reports/hybrid_matrix

  - name: retrieval_lift_analysis
    description: Query-level diagnostics for promoted, demoted, new-hit, and lost-hit rerank cases.
    command:
      - python
      - scripts/analyze_retrieval_lift.py
      - --before-run
      - outputs/W4_dense/run.tsv
      - --after-run
      - outputs/W5_reranker_full/run.tsv
      - --output-dir
      - outputs/W5_retrieval_lift_analysis

  - name: generation_bm25
    description: T5 generation over BM25 top-3.
    command:
      - mgq-generate
      - --config
      - configs/baseline.yaml
      - --input-run
      - outputs/W2_bm25/run.tsv
      - --output-dir
      - outputs/W3_generation_bm25_full
      - --retrieval-source
      - bm25

  - name: generation_reranked
    description: T5 generation over cross-encoder-reranked top-3.
    command:
      - mgq-generate
      - --config
      - configs/baseline.yaml
      - --input-run
      - outputs/W5_reranker_full/run.tsv
      - --output-dir
      - outputs/W3_generation_reranked_full
      - --retrieval-source
      - reranked
      - --restrict-to-run
      - outputs/W5_reranker_full/run.tsv

  - name: paired_bootstrap_ci
    description: Paired-bootstrap confidence intervals for rerank lift.
    command:
      - python
      - scripts/bootstrap_generation_comparison.py
      - --bm25-dir
      - outputs/W3_generation_bm25_full
      - --reranked-dir
      - outputs/W3_generation_reranked_full
      - --output-dir
      - outputs/W3_generation_bootstrap_full

  - name: grounding_audit
    description: Deterministic grounding metrics over paired generation outputs.
    command:
      - python
      - scripts/grounding_audit.py
      - --bm25-dir
      - outputs/W3_generation_bm25_full
      - --reranked-dir
      - outputs/W3_generation_reranked_full
      - --output-dir
      - outputs/W7_grounding

  - name: rag_triad
    description: Context relevance, groundedness, and answer relevance report.
    command:
      - mgq-rag-triad
      - --predictions
      - bm25=outputs/W3_generation_bm25_full/predictions.jsonl
      - --predictions
      - reranked=outputs/W3_generation_reranked_full/predictions.jsonl
      - --output-dir
      - outputs/W8_rag_triad
      - --baseline-config
      - bm25

  - name: generator_capacity_sweep
    description: Larger-generator sweep; override --model-name to google/flan-t5-base if desired.
    command:
      - python
      - scripts/run_generator_capacity_sweep.py
      - --model-name
      - t5-base
      - --num-eval-queries
      - "9999"
