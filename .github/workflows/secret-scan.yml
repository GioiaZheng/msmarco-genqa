name: Secret scan

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  high-confidence-secrets:
    name: High-confidence secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run secret scan
        run: python3 scripts/check_secrets.py
