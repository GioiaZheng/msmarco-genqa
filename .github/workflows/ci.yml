# Default CI: install deps, install the project as editable, run the
# fast unit-test suite. Deliberately does NOT download MS MARCO data,
# pre-trained models, or HF metric scripts — those live behind the
# ``slow`` marker which is excluded by default (see pyproject.toml).
#
# First-run install is ~5 min (torch + faiss-cpu + sentence-transformers
# are large CPU wheels). Subsequent runs hit the pip cache.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Avoid duplicate PR workflows while preserving every main-branch run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (default, no slow)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch index — the default index pulls in CUDA wheels
          # that bloat the install by ~2 GB on Linux.
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.12.0"
          pip install -r requirements.txt
          pip install -e ".[evaluation]"

      - name: Run default unit tests
        run: pytest -q

      - name: Check headline metric metadata
        run: python scripts/check_headline_metrics.py

      - name: Check fixture headline metric goldens
        run: python scripts/check_fixture_headline_metrics.py

      - name: Cross-check binary and graded TREC fixture metrics
        run: |
          mgq-trec-eval --backend ir-measures --qrels-format trec \
            --qrels tests/fixtures/trec_eval/qrels.trec \
            --run tests/fixtures/trec_eval/run.tsv \
            --output-dir /tmp/msmarco-trec-eval
          mgq-trec-eval --backend ir-measures --qrels-format trec \
            --rel-threshold 2 \
            --qrels tests/fixtures/trec_eval/graded_qrels.trec \
            --run tests/fixtures/trec_eval/graded_run.tsv \
            --output-dir /tmp/msmarco-trec-eval-graded

      - name: Check lockfile resolver consistency
        run: python -m pip install --dry-run -r requirements-lock.txt

      - name: Check demo notebooks
        run: python scripts/check_notebooks.py

      - name: Check artifact boundaries
        run: python scripts/check_artifact_boundaries.py

      - name: Check canonical artifact registry
        run: python scripts/check_artifact_registry.py

      - name: Check generated report tables
        run: |
          python scripts/export_report_tables.py
          git diff --exit-code reports/generated/tables

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src tests experiments scripts
